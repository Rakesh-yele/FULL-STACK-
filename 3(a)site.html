<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Semantics</title>
</head>
<body>
    <header>
        <h1>My Site</h1>
        <nav>
            <a href="#">Home</a> <a href="#">About</a>
        </nav>
    </header>
    
    <div>
        <main>
            <article>
                <section>
                    <h2>Article Title</h2>
                    <p>Content with <span style="font-weight:bold;">span inline</span>.</p>
                </section>
                
                <figure>
                    <img src="https://via.placeholder.com/200" alt="Image">
                    <figcaption>Fig caption</figcaption>
                </figure>
            </article>
            
            <aside style="border-style:solid;border-width:2px;margin:5px;">
                <p>aside section</p>
            </aside>
        </main>
    </div>
    
    <footer style="border-style:solid;border-width:2px" >
        <p>footer section</p>
    </footer>
</body>
</html>
