<!DOCTYPE html>
<html>
<head>
<style>
.a1 {
    font-size: 30px;
    font-weight: bold;
    font-style: italic;
}

.a2 {
    font-size: 20px;
    text-decoration: underline;
    text-transform: uppercase;
}
</style>
</head>
<body>

<div style="text-align: center;">
    <h1 class="a2">This is Styled by CSS text properties</h1>
</div>

<p class="a1">This is styled by CSS font properties</p>

</body>
</html>
