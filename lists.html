<!DOCTYPE html>
<html>
  <head><title>Lists in HTML</title> </head>
  <body>
    <h2>Unordered List</h2>
    <ul>
        <li>Tea</li>
        <li>Coffee</li>
        <li>Milk</li>
    </ul>
    <h2>Ordered List</h2>
    <ol>
        <li>Tea</li>
        <li>Coffee</li>
        <li>Milk</li>
    </ol>
    <h2>Nested Lists</h2>
    <ol>
        <li>Tea<ol>
            <li>Black Tea</li>
            <li>Green Tea</li>
            <li>Lemon Tea</li>
        </ol></li>
        <li>Coffee<ul>
            <li>Cappuccino</li>
            <li>Espresso</li>
            <li>Latte</li>
        </ul></li>
    </ol>
    <h2>List Definition</h2>
    <dl>
        <dt>HTML</dt>
        <dd>Hyper Text Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheet</dd>
    </dl>
  </body>
</html>
