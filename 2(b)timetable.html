<!DOCTYPE html>
<html>
<head>
  <title>Weekly Timetable - Table Attributes Demo</title>
</head>
<body>
  <h2>Weekly Timetable (Table Attributes Demo)</h2>
  <table border="1" cellspacing="6" cellpadding="10" style="border-collapse:collapse">
    <caption><strong>Class Timetable - Semester 1</strong></caption>
    <tr>
      <th rowspan="2">Day</th>
      <th colspan="6">Time Slots</th>
    </tr>
    <tr>
      <th>08:20–09:10</th>
      <th>09:10–10:00</th>
      <th>10:00-10:20</th>
      <th>10:20–11:10</th>
      <th>11:10–12:00</th>
    </tr>
    <tr>
      <td style="font-weight:bold">Monday</td>
      <td>CN</td>
      <td>MEFA</td>
      <td rowspan="6" style="background:#f7f7f7; font-weight:bold; text-align:center;">Break</td>
      <td>OS</td>
      <td>DBMS</td>
    </tr>

    <!-- Tuesday -->
    <tr>
      <td><strong>Tuesday</strong></td>
      <td>OS</td>
      <td>FSD</td>
      <td colspan="2">OS&CN LAB(A-305)</td>
    </tr>

    <!-- Wednesday -->
    <tr>
      <td><strong>WEDNESDAY</strong></td>
      <td>CN</td>
      <td>OS</td>
      <td COLSPAN="2">FSD LAB</td>
    </tr>
    <!-- Thursday -->
    <tr>
      <td><strong>THURSDAY</strong></td>
      <td>DBMS</td>
      <td >P&S</td>
      <td>OS</td>
      <td>MEFA</td>
        </tr>

    <!-- Friday -->
    <tr>
      <td><strong>FRIDAY</strong></td>
      <td>MEFA</td>
      <td>P&S</td>
      <td>OS</td>
      <td>VERBAL</td>
    </tr>
  </table>
</body>
</html>
