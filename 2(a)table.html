<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Example</title>
</head>
<body>
    <h2>Working of Tables in HTML</h2>

    <table border style="border-collapse:collapse" > 
  
        <tr>
            <th>Student Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td rowspan="2">Rakesh</td>
            <td>java</td>
            <td>29</td>
        </tr>
        <tr>
            <td>python</td>
            <td>25</td>
        </tr>

        <tr>
            <td>Nikhil</td>
          <td colspan="2">Not Attended all the Exams</td>
        </tr>

        <tr>
            <td rowspan="3">Harsha</td>
            <td>java</td>
            <td>30</td>
        </tr>
      <tr>
            <td>python</td>
            <td>29</td>
        </tr>
      <tr>
            <td>adsa</td>
            <td>28</td>
        </tr>
    </table>
</body>
</html>
